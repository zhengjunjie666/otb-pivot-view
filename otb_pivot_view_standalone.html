<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OTB Category Metrics - Pivot View</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f6f7; color: #1f2329; }
.header { background: #fff; border-bottom: 1px solid #e5e6eb; padding: 16px 24px; position: sticky; top: 0; z-index: 200; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .sub { font-size: 13px; color: #8f959e; margin-top: 4px; }
.controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.controls label { font-size: 13px; color: #646a73; font-weight: 500; }
.controls select { padding: 6px 28px 6px 10px; border: 1px solid #cedce4; border-radius: 6px; font-size: 13px; background: #fff; cursor: pointer; min-width: 140px; }
.controls select:focus { outline: none; border-color: #3370ff; }
.content { padding: 16px 24px; }
.cat-section { margin-bottom: 24px; background: #fff; border-radius: 8px; border: 1px solid #e5e6eb; overflow: hidden; }
.cat-header { background: #f0f5ff; padding: 10px 16px; font-size: 14px; font-weight: 600; color: #1f2329; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.cat-header:hover { background: #e3edff; }
.cat-header .arrow { transition: transform 0.2s; font-size: 12px; color: #8f959e; }
.cat-header.collapsed .arrow { transform: rotate(-90deg); }
.cat-body { overflow: auto; max-height: 80vh; }
.cat-body.hidden { display: none; }

/* Table with frozen header row and frozen left columns */
.table-wrap { position: relative; overflow: auto; max-height: calc(80vh - 40px); }
table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid #f0f1f3; white-space: nowrap; text-align: right; }
th { background: #fafafa; color: #646a73; font-weight: 500; font-size: 12px; z-index: 10; }
/* Frozen header row */
thead tr { position: sticky; top: 0; z-index: 20; }
thead th { position: sticky; top: 0; background: #fafafa; border-bottom: 2px solid #dcdfe6; }
/* Frozen left columns */
th.col-group, td.col-group { position: sticky; left: 0; z-index: 12; background: inherit; }
th.col-metric, td.col-metric { position: sticky; left: 180px; z-index: 12; background: inherit; border-right: 2px solid #e5e6eb; }
th.col-group { background: #fafafa; z-index: 25; left: 0; }
th.col-metric { background: #fafafa; z-index: 25; left: 180px; }

td.col-group { text-align: left; color: #8f959e; font-size: 12px; font-weight: 600; background: #f9fafb; min-width: 180px; max-width: 180px; }
td.col-metric { text-align: left; font-weight: 500; color: #1f2329; min-width: 160px; background: #fff; }

td.val { font-variant-numeric: tabular-nums; min-width: 100px; }
td.null-val { color: #d0d3d6; }
tr:hover td { background: #f5f8ff !important; }
tr:hover td.col-group { background: #eef2ff !important; }
tr:hover td.col-metric { background: #f5f8ff !important; }
/* Group separator row */
tr.group-sep td { border-top: 2px solid #e5e6eb; }

/* Params section - global, no division */
.param-section { margin-bottom: 24px; background: #fff; border-radius: 8px; border: 1px solid #d0e6d0; overflow: hidden; }
.param-header { background: #f0f7f0; padding: 10px 16px; font-size: 14px; font-weight: 600; color: #2d6a4f; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.param-header:hover { background: #e0f0e0; }
.param-header .arrow { transition: transform 0.2s; font-size: 12px; color: #8f959e; }
.param-header.collapsed .arrow { transform: rotate(-90deg); }
.param-body { overflow: auto; max-height: 80vh; }
.param-body.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="controls">
    <div>
      <label>Division</label>
      <select id="catFilter"><option value="">All Divisions</option></select>
    </div>
    <div>
      <label>Metric Group</label>
      <select id="groupFilter"><option value="">All Groups</option></select>
    </div>
    <div>
      <label>Expand/Collapse</label>
      <select id="expandCtrl">
        <option value="all">Expand All</option>
        <option value="none">Collapse All</option>
      </select>
    </div>
    <div style="margin-left:auto; display:flex; gap:8px;">
      <button id="btnExportCsv" style="padding:6px 16px; border:1px solid #cedce4; border-radius:6px; background:#fff; cursor:pointer; font-size:13px; color:#646a73;" onmouseover="this.style.borderColor='#3370ff';this.style.color='#3370ff'" onmouseout="this.style.borderColor='#cedce4';this.style.color='#646a73'">📥 Export CSV</button>
      <button id="btnExportExcel" style="padding:6px 16px; border:1px solid #3370ff; border-radius:6px; background:#3370ff; cursor:pointer; font-size:13px; color:#fff; font-weight:500;" onmouseover="this.style.background='#2860e0'" onmouseout="this.style.background='#3370ff'">📥 Export Excel</button>
    </div>
  </div>
</div>

<div class="content" id="content"></div>

<script>
// Format helpers
function fmtVal(val, fmt) {
  if (val === null || val === undefined) return '';
  if (fmt === 'amt') return Math.round(val).toLocaleString('en-US');
  if (fmt === 'pct') return (val * 100).toFixed(2) + '%';
  if (fmt === 'qty') return Math.round(val).toLocaleString('en-US');
  if (fmt === 'prc') return val.toFixed(2);
  if (fmt === 'num') return val.toFixed(1);
  return val;
}

let DATA = null;

function render() {
  const catFilter = document.getElementById('catFilter').value;
  const groupFilter = document.getElementById('groupFilter').value;
  const expandCtrl = document.getElementById('expandCtrl').value;
  const container = document.getElementById('content');

  // Filter rows
  let rows = DATA.pivotRows;
  if (catFilter) rows = rows.filter(r => r.catCode === catFilter);
  if (groupFilter) rows = rows.filter(r => r.metricGroup === groupFilter);

  // Build metric order map
  const orderMap = {};
  DATA.metricOrder.forEach((name, idx) => { orderMap[name] = idx; });

  // Group by category
  const byCat = {};
  for (const row of rows) {
    if (!byCat[row.catCode]) byCat[row.catCode] = { name: row.catName, rows: [] };
    byCat[row.catCode].rows.push(row);
  }

  const catCodes = Object.keys(byCat).sort();
  const months = DATA.monthsOrder;

  let html = '';

  // ====== Params & Display section (global, shown once) ======
  if (DATA.paramRows && DATA.paramRows.length > 0) {
    const paramRows = DATA.paramRows;
    const isCollapsed = expandCtrl === 'none';
    const sortedParam = [...paramRows].sort((a, b) => (orderMap[a.metricName] ?? 9999) - (orderMap[b.metricName] ?? 9999));
    html += `<div class="param-section">`;
    html += `<div class="param-header ${isCollapsed ? 'collapsed' : ''}" onclick="toggleCat(this)">
      <span>Params & Display &nbsp;<span style="font-size:12px;font-weight:400;color:#52805a">(Global — applies to all divisions)</span></span>
      <span class="arrow">▼</span>
    </div>`;
    html += `<div class="param-body ${isCollapsed ? 'hidden' : ''}">`;
    html += `<div class="table-wrap"><table><thead><tr>`;
    html += `<th class="col-metric" style="left:0">Metric Name</th>`;
    for (const m of months) { html += `<th>${m}</th>`; }
    html += `</tr></thead><tbody>`;
    for (const row of sortedParam) {
      const isFirst = sortedParam.indexOf(row) === 0;
      html += `<tr>`;
      html += `<td class="col-metric" style="position:sticky;left:0;border-right:2px solid #e5e6eb">${row.metricName}</td>`;
      for (const m of months) {
        const val = row.months[m];
        const display = val !== null && val !== undefined ? fmtVal(val, row.fmt) : '';
        const cls = val === null || val === undefined ? 'val null-val' : 'val';
        html += `<td class="${cls}">${display}</td>`;
      }
      html += `</tr>`;
    }
    html += `</tbody></table></div></div></div>`;
  }

  // ====== Per-division sections ======
  for (const cc of catCodes) {
    const cat = byCat[cc];
    const isCollapsed = expandCtrl === 'none';
    html += `<div class="cat-section">`;
    html += `<div class="cat-header ${isCollapsed ? 'collapsed' : ''}" onclick="toggleCat(this)">
      <span>${cat.name} (${cc})</span>
      <span class="arrow">▼</span>
    </div>`;
    html += `<div class="cat-body ${isCollapsed ? 'hidden' : ''}">`;
    html += `<div class="table-wrap"><table><thead><tr>`;
    html += `<th class="col-group">Metric Group</th>`;
    html += `<th class="col-metric">Metric Name</th>`;
    for (const m of months) {
      html += `<th>${m}</th>`;
    }
    html += `</tr></thead><tbody>`;

    // Sort rows by defined metric order
    const sortedRows = cat.rows.sort((a, b) => {
      const oa = orderMap[a.metricName] !== undefined ? orderMap[a.metricName] : 9999;
      const ob = orderMap[b.metricName] !== undefined ? orderMap[b.metricName] : 9999;
      return oa - ob;
    });

    // Pre-calculate rowspan for group merging
    // Count consecutive rows with same group
    const groupSpans = [];
    let i = 0;
    while (i < sortedRows.length) {
      const group = sortedRows[i].metricGroup;
      let span = 1;
      while (i + span < sortedRows.length && sortedRows[i + span].metricGroup === group) {
        span++;
      }
      groupSpans.push({ group, span, startIdx: i });
      i += span;
    }

    // Render rows
    let spanIdx = 0;
    for (let ri = 0; ri < sortedRows.length; ri++) {
      const row = sortedRows[ri];
      const gs = groupSpans[spanIdx];
      const isGroupStart = (ri === gs.startIdx);
      const isFirstRow = (ri === 0);
      const isGroupBorder = isGroupStart && ri > 0;

      html += `<tr class="${isGroupBorder ? 'group-sep' : ''}">`;

      // Group cell: only render on first row of group, with rowspan
      if (isGroupStart) {
        html += `<td class="col-group" rowspan="${gs.span}">${gs.group}</td>`;
      }

      // Metric name cell
      html += `<td class="col-metric">${row.metricName}</td>`;

      // Month value cells
      for (const m of months) {
        const val = row.months[m];
        const display = val !== null && val !== undefined ? fmtVal(val, row.fmt) : '';
        const cls = val === null || val === undefined ? 'val null-val' : 'val';
        html += `<td class="${cls}">${display}</td>`;
      }
      html += `</tr>`;

      // Advance spanIdx when we've passed current group
      if (ri === gs.startIdx + gs.span - 1) {
        spanIdx++;
      }
    }

    html += `</tbody></table></div></div></div>`;
  }

  container.innerHTML = html;
}

function toggleCat(el) {
  el.classList.toggle('collapsed');
  const body = el.nextElementSibling;
  body.classList.toggle('hidden');
}

// ========== Export functions ==========
function getFilteredData() {
  const catFilter = document.getElementById('catFilter').value;
  const groupFilter = document.getElementById('groupFilter').value;
  let rows = DATA.pivotRows;
  if (catFilter) rows = rows.filter(r => r.catCode === catFilter);
  if (groupFilter) rows = rows.filter(r => r.metricGroup === groupFilter);

  const orderMap = {};
  DATA.metricOrder.forEach((name, idx) => { orderMap[name] = idx; });

  const byCat = {};
  for (const row of rows) {
    if (!byCat[row.catCode]) byCat[row.catCode] = { name: row.catName, rows: [] };
    byCat[row.catCode].rows.push(row);
  }

  const catCodes = Object.keys(byCat).sort();
  const months = DATA.monthsOrder;
  return { byCat, catCodes, months, orderMap };
}

function exportCsv() {
  const { byCat, catCodes, months, orderMap } = getFilteredData();
  const BOM = '\uFEFF'; // UTF-8 BOM for Excel Chinese support
  let csv = BOM;

  // Header
  csv += ['Division', 'Metric Group', 'Metric Name', ...months].join(',') + '\n';

  for (const cc of catCodes) {
    const cat = byCat[cc];
    const sortedRows = cat.rows.sort((a, b) => (orderMap[a.metricName] ?? 9999) - (orderMap[b.metricName] ?? 9999));
    for (const row of sortedRows) {
      const vals = months.map(m => {
        const v = row.months[m];
        if (v === null || v === undefined) return '';
        const display = fmtVal(v, row.fmt);
        // Escape comma in CSV
        return display.includes(',') ? '"' + display + '"' : display;
      });
      csv += [cat.name + '(' + cc + ')', row.metricGroup, row.metricName, ...vals].join(',') + '\n';
    }
  }

  downloadFile(csv, 'OTB_Category_Metrics_Pivot.csv', 'text/csv;charset=utf-8');
}

async function exportExcel() {
  const { byCat, catCodes, months, orderMap } = getFilteredData();

  const ExcelJS = window.ExcelJS;
  const wb = new ExcelJS.Workbook();
  wb.creator = 'OTB Pivot View';
  const ws = wb.addWorksheet('OTB Pivot View', {
    views: [{ state: 'frozen', xSplit: 3, ySplit: 1 }]
  });

  // Number format map
  const fmtMap = {
    amt: '#,##0.0,,"M"',
    pct: '0.00%',
    qty: '#,##0',
    prc: '0.00',
    num: '0.0',
  };
  const BASE_FONT = 'DengXian'; // 等线

  // Helper: keep raw value (amt uses Excel format scaling, not JS division)
  function toExcelVal(v, fmt) {
    if (v === null || v === undefined) return null;
    return v;
  }

  // Header style
  const hdrFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8F0FE' } };
  const hdrFont = { bold: true, size: 11, name: BASE_FONT };
  const hdrBorder = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'medium'}, right:{style:'thin'} };
  const cellBorder = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
  const divFill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDBEAFE' } };
  const grpFill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9FAFB' } };

  // Header row
  const headerRow = ws.addRow(['Division', 'Metric Group', 'Metric Name', ...months]);
  headerRow.eachCell(cell => {
    cell.fill = hdrFill;
    cell.font = hdrFont;
    cell.border = hdrBorder;
    cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: false };
  });
  headerRow.height = 22;

  // Track max char widths per column
  const colWidths = ['Division', 'Metric Group', 'Metric Name', ...months].map(h => h.length + 2);

  for (const cc of catCodes) {
    const cat = byCat[cc];
    const sortedRows = [...cat.rows].sort((a, b) => (orderMap[a.metricName] ?? 9999) - (orderMap[b.metricName] ?? 9999));
    const divLabel = cat.name + ' (' + cc + ')';
    const divStartRow = ws.rowCount + 1;

    // Group by metricGroup to compute spans
    const groupSpans = [];
    let gi = 0;
    while (gi < sortedRows.length) {
      const grp = sortedRows[gi].metricGroup;
      let span = 1;
      while (gi + span < sortedRows.length && sortedRows[gi + span].metricGroup === grp) span++;
      groupSpans.push({ grp, span, startIdx: gi });
      gi += span;
    }

    let spanIdx = 0;
    for (let ri = 0; ri < sortedRows.length; ri++) {
      const row = sortedRows[ri];
      const gs = groupSpans[spanIdx];
      const isGroupStart = ri === gs.startIdx;

      const rowVals = [divLabel, row.metricGroup, row.metricName];
      for (const m of months) {
        const v = row.months[m];
        // Store raw number for proper Excel formatting
        rowVals.push(v !== null && v !== undefined ? v : null);
      }
      const dataRow = ws.addRow(rowVals);
      dataRow.height = 18;

      // Division cell (col 1)
      const divCell = dataRow.getCell(1);
      divCell.fill = divFill;
      divCell.font = { bold: true, size: 11, name: BASE_FONT };
      divCell.alignment = { vertical: 'middle', horizontal: 'left' };
      divCell.border = cellBorder;

      // Metric group cell (col 2)
      const grpCell = dataRow.getCell(2);
      grpCell.fill = grpFill;
      grpCell.font = { bold: true, size: 11, name: BASE_FONT, color: { argb: 'FF646A73' } };
      grpCell.alignment = { vertical: 'middle', horizontal: 'left' };
      grpCell.border = cellBorder;

      // Metric name cell (col 3)
      const nameCell = dataRow.getCell(3);
      nameCell.font = { size: 11, name: BASE_FONT };
      nameCell.alignment = { vertical: 'middle', horizontal: 'left' };
      nameCell.border = cellBorder;

      // Value cells
      for (let mi = 0; mi < months.length; mi++) {
        const cell = dataRow.getCell(4 + mi);
        const v = row.months[months[mi]];
        if (v !== null && v !== undefined) {
          cell.value = toExcelVal(v, row.fmt);
          cell.numFmt = fmtMap[row.fmt] || 'General';
          // Track max width
          const dispLen = fmtVal(v, row.fmt).length + 1;
          if (dispLen > colWidths[3 + mi]) colWidths[3 + mi] = dispLen;
        }
        cell.font = { size: 11, name: BASE_FONT };
        cell.border = cellBorder;
        cell.alignment = { vertical: 'middle', horizontal: 'right' };
      }

      // Update col widths
      if (divLabel.length + 2 > colWidths[0]) colWidths[0] = divLabel.length + 2;
      if (row.metricGroup.length + 2 > colWidths[1]) colWidths[1] = row.metricGroup.length + 2;
      if (row.metricName.length + 2 > colWidths[2]) colWidths[2] = row.metricName.length + 2;

      if (ri === gs.startIdx + gs.span - 1) spanIdx++;
    }

    // Merge Division column cells for this cat block
    const divEndRow = ws.rowCount;
    if (divEndRow > divStartRow) {
      ws.mergeCells(divStartRow, 1, divEndRow, 1);
      const mergedDiv = ws.getCell(divStartRow, 1);
      mergedDiv.fill = divFill;
      mergedDiv.font = { bold: true, size: 11, name: BASE_FONT };
      mergedDiv.alignment = { vertical: 'middle', horizontal: 'left', wrapText: false };
      mergedDiv.border = cellBorder;
    }

    // Merge Metric Group column cells for each group in this cat
    let grpRowCursor = divStartRow;
    for (const gs of groupSpans) {
      const grpStart = grpRowCursor;
      const grpEnd = grpRowCursor + gs.span - 1;
      if (grpEnd > grpStart) {
        ws.mergeCells(grpStart, 2, grpEnd, 2);
        const mergedGrp = ws.getCell(grpStart, 2);
        mergedGrp.fill = grpFill;
        mergedGrp.font = { bold: true, size: 11, name: BASE_FONT, color: { argb: 'FF646A73' } };
        mergedGrp.alignment = { vertical: 'middle', horizontal: 'left', wrapText: false };
        mergedGrp.border = cellBorder;
      }
      grpRowCursor += gs.span;
    }
  }

  // Set column widths (auto-fit, capped)
  ws.columns.forEach((col, i) => {
    col.width = Math.min(Math.max(colWidths[i] || 10, 8), 40);
  });

  // Generate and download
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'OTB_Category_Metrics_Pivot.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setupExportButtons() {
  document.getElementById('btnExportCsv').addEventListener('click', exportCsv);
  document.getElementById('btnExportExcel').addEventListener('click', exportExcel);
}
